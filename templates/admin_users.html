{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h3 class="mb-0">Пользователи</h3>
  <a class="btn btn-sm btn-link text-decoration-none text-secondary me-2" href="{{ url_for('main.admin_home') }}">← Назад в панель</a>
</div>
<div class="card mb-4"><div class="card-body">
    <h6>Добавить пользователя</h6>
    <form method="post" class="row g-2">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="col-md-3"><input name="username" class="form-control" placeholder="Логин" required></div>
      <div class="col-md-3"><input name="password" class="form-control" placeholder="Пароль" required></div>
      <div class="col-md-3"><select name="role" class="form-select"><option value="editor">Редактор</option><option value="admin">Администратор</option></select></div>
      <div class="col-md-3"><button class="btn btn-primary w-100">Создать</button></div>
    </form>
</div></div>
<table class="table bg-white">
  <thead><tr><th>Логин</th><th>Роль</th><th>Действия</th></tr></thead>
  <tbody>
  {% for u in users %}
    <tr><td>{{ u.username }}</td><td>{{ u.role }}</td>
      <td>
        <form method="post" action="{{ url_for('main.admin_user_reset', user_id=u.id) }}" class="d-flex gap-1" style="max-width:320px">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input name="password" class="form-control form-control-sm" placeholder="Новый пароль">
          <button class="btn btn-sm btn-outline-primary text-nowrap">Сменить пароль</button>
        </form>
        <form method="post" action="{{ url_for('main.admin_user_delete', user_id=u.id) }}" class="mt-1" onsubmit="return confirm('Удалить?');">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-sm btn-outline-danger">Удалить</button>
        </form>
      </td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
