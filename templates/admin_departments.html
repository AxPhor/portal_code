{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3 class="mb-0">Управление отделами</h3>
  <a href="{{ url_for('main.admin_employees') }}" class="btn btn-sm btn-outline-secondary">← Назад к сотрудникам</a></div>
<div class="card mb-4 shadow-sm"><div class="card-body">
    <form method="post" class="d-flex gap-2" style="max-width: 500px;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="name" class="form-control" placeholder="Название отдела" required>
      <button class="btn btn-primary">Добавить</button>
    </form>
</div></div>
<table class="table table-hover bg-white shadow-sm">
  <thead class="table-light"><tr><th>Название</th><th>Сотрудников</th><th>Действия</th></tr></thead>
  <tbody>
  {% for d in depts %}
    <tr><td>{{ d.name }}</td><td>{{ d.cnt }}</td>
      <td class="text-nowrap">
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('main.admin_department_edit', dept_id=d.id) }}">Изменить</a>
        {% if current_role == 'admin' %}
          <form method="post" action="{{ url_for('main.admin_department_delete', dept_id=d.id) }}" style="display:inline" onsubmit="return confirm('Удалить?');">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-sm btn-outline-danger" {% if d.cnt %}disabled{% endif %}>Удалить</button>
          </form>
        {% endif %}
      </td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
