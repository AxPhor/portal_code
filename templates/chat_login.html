<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход в мессенджер</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card shadow-sm" style="width: 400px;">
        <div class="card-body p-4 text-center">
            <h3 class="mb-3">💬 Мессенджер</h3>
            <p class="text-muted small">Выберите свое ФИО и введите пароль, выданный администратором.</p>
            
            {% with msgs = get_flashed_messages(with_categories=true) %}
              {% for cat, m in msgs %}
                <div class="alert alert-{{cat}} alert-dismissible fade show" role="alert">
                  {{ m }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
              {% endfor %}
            {% endwith %}

            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3 text-start">
                    <label class="form-label">Сотрудник</label>
                    <select name="employee_id" class="form-select" required>
                        <option value="">-- Выберите себя --</option>
                        {% for e in employees %}
                            <option value="{{ e.id }}">{{ e.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2">Войти</button>
                <a href="{{ url_for('main.portal_home') }}" class="btn btn-link text-decoration-none">Вернуться на портал</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
